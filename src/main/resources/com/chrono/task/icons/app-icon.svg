<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Chrono Task AI: stopwatch (time tracking) + progress arc + checkmark (tasks) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#shine)"/>

  <!-- Crown and side button -->
  <rect x="104" y="30" width="48" height="16" rx="8" fill="#FFFFFF"/>
  <rect x="119" y="40" width="18" height="24" rx="4" fill="#FFFFFF"/>
  <rect x="188" y="66" width="16" height="26" rx="6" fill="#FFFFFF" transform="rotate(45 196 79)"/>

  <!-- Stopwatch ring -->
  <circle cx="128" cy="146" r="80" fill="#1E1B4B" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="16"/>

  <!-- Progress track + arc (270°) -->
  <circle cx="128" cy="146" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="14"/>
  <path d="M128 92 A54 54 0 1 1 74 146" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>

  <!-- Checkmark -->
  <path d="M104 147 L121 164 L153 130" fill="none" stroke="#FFFFFF" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
